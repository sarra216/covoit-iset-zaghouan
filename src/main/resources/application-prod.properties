# =========================================================
# Configuration de PRODUCTION (activée par SPRING_PROFILES_ACTIVE=prod)
# Aucune donnée secrète ici : tout vient des variables d'environnement du serveur.
# Si une variable obligatoire manque, l'application refuse de démarrer (c'est voulu).
# =========================================================

# Port fourni par l'hébergeur (Railway, Render…) ou 8080 par défaut
server.port=${PORT:8080}
# Derrière le proxy HTTPS de l'hébergeur : garder la bonne adresse (https) dans les redirections
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# ---------- Base de données (obligatoire) ----------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Sécurité (obligatoire) ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.duree-heures=24
# En production, les pages et l'API sont sur la même adresse : aucune autre origine autorisée
app.cors.origines=

# ---------- Comptes ----------
app.url=${APP_URL}
app.admin.email=${ADMIN_EMAIL:}
app.inscription.domaines=${DOMAINES_AUTORISES:}
app.verification-email=${EMAIL_VERIFICATION:true}

# ---------- Emails (SMTP) ----------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.expediteur=${MAIL_FROM:${MAIL_USERNAME:no-reply@covoit-iset.tn}}

# ---------- Journaux : fichier gardé 14 jours ----------
logging.file.name=logs/covoit.log
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=10MB
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
