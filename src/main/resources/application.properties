spring.application.name=covoit-iset-zaghouan
server.port=8080

# MySQL : la base covoit_iset est créée automatiquement si elle n'existe pas
spring.datasource.url=jdbc:mysql://localhost:3306/covoit_iset?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis
spring.datasource.username=root
spring.datasource.password=

# Les tables sont créées / mises à jour à partir des entités
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
