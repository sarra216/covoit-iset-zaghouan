<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil du conducteur · Covoit ISET Zaghouan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- User story #2 : Consulter le profil du conducteur  (+ bouton Contacter de la story #7) -->
<body>
<main>
  <div id="alerte" hidden></div>
  <div id="profil"></div>
</main>

<script src="js/api.js"></script>
<script>
  const utilisateur = exigerConnexion();
  const id = Number(new URLSearchParams(window.location.search).get('id'));
  afficherNav(id === utilisateur.id ? 'profil' : '');

  async function charger() {
    try {
      const p = await api('/conducteurs/' + id);
      const contacter = id !== utilisateur.id
        ? `<a class="bouton" href="messages.html?avec=${p.id}">Contacter le conducteur</a>` : '';
      document.getElementById('profil').innerHTML = `
        <h1>${echapper(p.prenom)} ${echapper(p.nom)}</h1>
        <div class="carte">
          <p>Conducteur · membre depuis le ${formaterDate(p.membreDepuis)}</p>
          <div class="stats">
            <div class="stat"><strong>${p.nombreTrajets}</strong>trajet(s) proposé(s)</div>
            <div class="stat"><strong>${p.trajetsAVenir.length}</strong>trajet(s) à venir</div>
          </div>
          <p>${contacter}</p>
        </div>
        <h2>Trajets à venir</h2>
        ${p.trajetsAVenir.length === 0
          ? '<p class="vide">Aucun trajet à venir.</p>'
          : p.trajetsAVenir.map(t => carteTrajet(t)).join('')}`;
    } catch (err) {
      afficherAlerte(document.getElementById('alerte'), err.message);
    }
  }
  charger();
</script>
</body>
</html>
