<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e4b8f">
  <title>Profil du conducteur · Covoit ISET Zaghouan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- User story #2 : Consulter le profil du conducteur -->
<body>
<main class="conteneur">
  <div id="retour"></div>
  <div id="contenu"><div class="bloc"><div class="chargement"></div><div class="chargement"></div></div></div>
</main>

<script src="js/api.js"></script>
<script>
  const u = exigerConnexion();
  afficherNav('recherche');
  const id = Number(parametre('id'));
  const $ = x => document.getElementById(x);
  $('retour').innerHTML = lienRetour();

  (async () => {
    try {
      const [p, avis] = await Promise.all([api('/conducteurs/' + id), api('/avis/conducteur/' + id).catch(() => [])]);
      const nom = p.prenom + ' ' + p.nom;
      const depuis = new Date(p.membreDepuis).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const voiture = [p.voitureModele, p.voitureCouleur].filter(Boolean).map(echapper).join(', ');
      $('contenu').innerHTML = `
        <div class="colonnes">
          <section>
            <h2 class="section">Trajets à venir</h2>
            <div class="bloc liste">${p.trajetsAVenir.length ? p.trajetsAVenir.map(t => ligneTrajet(t, '', true)).join('')
              : etatVide('route', 'Aucun trajet à venir', 'Ses prochains trajets apparaîtront ici.')}</div>
            <h2 class="section">Avis des passagers</h2>
            <div class="bloc liste">${avis.length ? avis.map(a => `
              <div class="avis">
                <div class="tete-avis">${avatar(a.passagerNom, 's')}
                  <div><strong>${echapper(a.passagerNom)}</strong><span>${echapper(a.trajet)} · ${formaterMoment(a.dateCreation)}</span></div>
                  ${etoiles(a.note)}</div>
                ${a.commentaire ? `<p>${echapper(a.commentaire)}</p>` : ''}
              </div>`).join('')
              : etatVide('etoile', 'Pas encore d\'avis', 'Les passagers peuvent noter le conducteur après un trajet.')}</div>
          </section>
          <aside class="colle">
            <div class="bloc">
              <div class="identite">
                ${avatar(nom, 'xl')}
                <h1>${echapper(nom)}</h1>
                <span class="etat bleu">Conducteur depuis ${depuis}</span>
                ${p.nombreAvis ? `<div class="note-globale">${etoiles(p.noteMoyenne, 'grandes')} ${noteTexte(p.noteMoyenne)} <span style="color:var(--asphalte);font-weight:600">(${p.nombreAvis} avis)</span></div>` : ''}
              </div>
              <div class="chiffres">
                <div><strong>${p.nombreTrajets}</strong><span>trajet${p.nombreTrajets > 1 ? 's' : ''} publié${p.nombreTrajets > 1 ? 's' : ''}</span></div>
                <div><strong>${p.trajetsAVenir.length}</strong><span>à venir</span></div>
              </div>
              ${voiture ? `<div class="donnee" style="padding:14px 22px"><span>Voiture</span><strong>${voiture}</strong></div>` : ''}
              ${id !== u.id ? `<div style="padding:0 22px 22px"><a class="btn plein" href="messages.html?avec=${p.id}">${ic('message')} Écrire à ${echapper(p.prenom)}</a>
                <div style="margin-top:10px">${boutonsSecurite(p.id, nom)}</div></div>` : ''}
            </div>
          </aside>
        </div>`;
      brancherSecurite($('contenu'));
    } catch (err) {
      $('contenu').innerHTML = `<div class="bloc">${etatVide('alerte', 'Ce profil est introuvable', echapper(err.message))}</div>`;
    }
  })();
</script>
</body>
</html>
